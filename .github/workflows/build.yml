name: Build & Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore V0XCleaner.sln

      - name: Build
        run: dotnet build V0XCleaner.sln --configuration Debug --no-restore

      - name: Test
        run: dotnet test V0XCleaner.sln --configuration Debug --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publier les résultats de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"
